# ── Keep Render free tier warm ────────────────────────────────
# Pings /health every 10 minutes so the server never cold-starts.
# GitHub Actions free tier gives 2000 min/month — this uses ~44/day.

name: Keep Render Warm

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, 24/7
  workflow_dispatch:           # also allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://metrocrowd.onrender.com/health)
          echo "Render responded: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Server unreachable (cold starting)"
          elif [ "$STATUS" = "200" ]; then
            echo "Server warm ✓"
          else
            echo "Unexpected status: $STATUS"
          fi
